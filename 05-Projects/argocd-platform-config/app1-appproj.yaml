apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: app1-project
  namespace: argocd
spec:
  description: Project for App1 frontend and backend workloads
  sourceRepos:
    # - https://github.com/CloudWithVarJosh/app1-frontend-config.git
    # - https://github.com/CloudWithVarJosh/app1-backend-config.git
    - https://github.com/pyellman/argocd-varjosh-05-projects-app1-backend-config.git
    - https://github.com/pyellman/argocd-varjosh-05-projects-app1-frontend-config.git
  destinations:
    # - namespace: app1-*
    - namespace: app1*
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: apps
      kind: Deployment
    # add Replicaset and Pod else they don't show in argo ui, but NOT having
    # them here does NOT prevent deployment from spinning them up because
    # deployment is a higher level controller for Replicaset and Pod - PY
    - group: "apps"
      kind: "ReplicaSet"
    - group: ""
      kind: "Pod"
    - group: ""
      kind: Service
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: Secret
  # clusterResourceBlackList is redundant here? varun says the Whitelist above created an implicit deny
  clusterResourceBlacklist:
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
  roles:
    - name: dev-readonly
      description: Read-only access for developers
      policies:
        - p, proj:app1-project:dev-readonly, applications, get, app1-project/*, allow
      groups:
        - app1-devs
    - name: platform-admin
      description: Full control for platform team
      policies:
        - p, proj:app1-project:platform-admin, applications, *, app1-project/*, allow
      groups:
        - platform-team