apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  # technically ns shouldn't be needed as it's specified in application
  # manifest destination, as varun repeatedly points out
  # namespace: app1-ns
  namespace: app1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          # image: cloudwithvarjosh/app1-backend:v1.0.0
          image: pyellman/argo-varjosh-app1-backend:latest
          ports:
            - containerPort: 5000
