apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  # namespace: app1-ns
  namespace: app1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          # image: cloudwithvarjosh/app1-backend:v1.0.0
          image: pyellman/argo-varjosh-app1-backend
          ports:
            - containerPort: 5000
