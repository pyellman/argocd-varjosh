apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  # technically ns shouldn't be needed as it's specified in application
  # manifest destination, as varun repeatedly points out
  # namespace: app1-ns
  namespace: app1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          # image: cloudwithvarjosh/app1-frontend:v1.0.0
          image: pyellman/argo-varjosh-app1-frontend:lastest
          ports:
            - containerPort: 4000
          env:
            - name: BACKEND_URL
              value: http://backend-svc:5000/api/message
