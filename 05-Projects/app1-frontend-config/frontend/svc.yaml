apiVersion: v1
kind: Service
metadata:
  name: frontend-svc
  # technically ns isn't needed as it's specified in application
  # manifest destination, as varun repeatedly points out
  # namespace: app1-ns
  namespace: app1
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 4000
